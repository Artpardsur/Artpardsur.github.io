<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор сайта · Pardus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0714'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23ffd60a'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span>♪</span> Редактор сайта</div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="projects">Проекты</button>
      <button class="tab" data-tab="tracks">Композиции</button>
      <button class="tab" data-tab="sfx">Звуки</button>
      <button class="tab" data-tab="stats">Статистика</button>
      <button class="tab" data-tab="git">Публикация</button>
    </nav>
    <div class="top-right">
      <span class="state" id="state">загрузка…</span>
      <a class="btn ghost" href="/" target="_blank" rel="noopener">Открыть сайт</a>
      <button class="btn primary" id="saveBtn">Сохранить</button>
    </div>
  </header>

  <main class="wrap">
    <aside class="side" id="side"></aside>
    <section class="edit" id="edit"></section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
